name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            type: dmg
          - os: windows-latest
            type: msi
          - os: ubuntu-latest
            type: deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Package installer
        shell: bash
        run: ./mvnw -B package -Pjpackage -Dos.type=${{ matrix.type }}

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: target/dist/*
          fail_on_unmatched_files: true
