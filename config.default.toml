# SlothMode default configuration.
# Copied to ~/.slothmode/config.toml on first run.

# Where your breaks live. A local .ics file — your calendar is the API.
calendar.path = "~/.slothmode/calendar/slothmode.ics"

# "fullscreen" (undismissable overlay) or "gentle" (toast nudge)
lockout.mode = "fullscreen"

# Any open-weight model you've pulled with `ollama pull`
model.name = "llama3.2:3b"
